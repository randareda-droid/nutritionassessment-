<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caregiver Feeding Questionnaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500..700&family=Noto+Naskh+Arabic:wght@600;700&display=swap">
<style>
/* Layout: one question group per step, large type for a caregiver on a phone; a separate English clinician view opens with #clinician. */
:root{
  --bg:#F1F5F1; --surface:#FFFFFF; --surface2:#F5F8F5; --ink:#1D2A25; --muted:#586861; --line:#D3DDD6;
  --accent:#2C6A50; --accent-ink:#FFFFFF; --accent-soft:#DDEBE2;
  --warn:#8A5A00; --warn-soft:#FAEBC9; --bad:#B3261E; --bad-soft:#FBE0DC; --good:#23704A; --good-soft:#DCF0E4;
  --wa:#1E8E57;
  --hero-a:#2F7355; --hero-b:#163C2C; --hero-ink:#FFFFFF; --hero-gold:#E6CB85;
  --f-display:'Literata','Noto Naskh Arabic',Georgia,serif; --f-body:'IBM Plex Sans Arabic','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1713; --surface:#15221C; --surface2:#1A2B23; --ink:#E4EEE8; --muted:#92A89C; --line:#29403A;
  --accent:#6CC39A; --accent-ink:#06261A; --accent-soft:#183A2C;
  --warn:#EDB95A; --warn-soft:#3B2E10; --bad:#FF8E80; --bad-soft:#431F1B; --good:#62CB91; --good-soft:#173A29; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1713; --surface:#15221C; --surface2:#1A2B23; --ink:#E4EEE8; --muted:#92A89C; --line:#29403A;
  --accent:#6CC39A; --accent-ink:#06261A; --accent-soft:#183A2C;
  --warn:#EDB95A; --warn-soft:#3B2E10; --bad:#FF8E80; --bad-soft:#431F1B; --good:#62CB91; --good-soft:#173A29; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:400 16px/1.6 var(--f-body);-webkit-text-size-adjust:100%}
.shell{max-width:860px;margin-inline:auto;padding-inline:16px;padding-block:20px 56px}
.shell.clin{max-width:1040px;font-size:15px;line-height:1.5}
h1{font:600 clamp(24px,5vw,32px)/1.25 var(--f-display);margin:0;text-wrap:balance}
h2{font:600 22px/1.3 var(--f-display);margin:0;text-wrap:balance}
h3{font:600 17px/1.35 var(--f-display);margin:0 0 12px;text-wrap:balance}
p{margin:0}
.sub{color:var(--muted);margin-top:6px;max-width:62ch}
.credit{margin-top:10px;font-size:13px;color:var(--muted);max-width:70ch}.credit b{color:var(--ink);font-weight:600}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.hero{position:relative;overflow:hidden;text-align:center;color:var(--hero-ink);border-radius:16px;padding:54px 22px 30px;margin-bottom:16px;
  background:radial-gradient(circle at 15% 0%,rgba(255,255,255,.16) 0,transparent 42%),radial-gradient(circle at 100% 110%,rgba(230,203,133,.22) 0,transparent 45%),linear-gradient(150deg,var(--hero-a),var(--hero-b));
  box-shadow:0 18px 40px -22px rgba(16,50,36,.7)}
.hero::before{content:"";position:absolute;inset:0;opacity:.14;pointer-events:none;background:radial-gradient(circle at 20% 20%,#fff 1px,transparent 1px) 0 0/22px 22px}
.hero>*{position:relative}
.hero h1{color:var(--hero-ink);font-size:clamp(25px,5.4vw,34px)}
.hero .sub{color:rgba(255,255,255,.9);margin-inline:auto;margin-top:10px}
.hero .credit{color:var(--hero-gold);margin:14px auto 0;font-size:13.5px}.hero .credit b{color:inherit}
.hero .btn.ghost{position:absolute;top:14px;inset-inline-end:14px;color:#fff;border-color:rgba(255,255,255,.75);background:rgba(255,255,255,.1)}

.btn{font:600 14px var(--f-body);padding:10px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:6px 12px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.alert{background:var(--warn-soft);border:1px solid var(--warn);border-radius:8px;padding:12px 14px;font-size:14.5px;margin-bottom:12px}
.alert.urgent{background:var(--bad-soft);border-color:var(--bad);font-weight:500}
.steps{display:flex;gap:6px;overflow-x:auto;padding-block:6px 10px;margin-bottom:10px;scrollbar-width:thin}
.st{flex:none;display:flex;align-items:center;gap:6px;font:500 13px var(--f-body);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer}
.st b{font-weight:600;font-variant-numeric:tabular-nums}
.st.done b::after{content:" ✓";color:var(--good)}
.st[aria-current=step]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st[aria-current=step] b::after{color:var(--accent-ink)}
.panel{display:flex;flex-direction:column;gap:14px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.intro{color:var(--muted);margin-top:4px}
.q{padding-block:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.q:first-child{border-top:0;padding-top:0}.q:last-child{padding-bottom:0}
.ql{font-weight:500}
.hint{font-size:13px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer;background:var(--surface);font-size:14.5px;min-height:42px}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;font:400 15px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:42px}
textarea{resize:vertical;line-height:1.5}
.inp{display:flex;align-items:center;gap:8px;max-width:300px}.inp i{font-style:normal;color:var(--muted);font-size:13px;white-space:nowrap}
.cks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 16px}
.ck{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px}.ck input{margin-top:6px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.note{background:var(--accent-soft);border-radius:8px;padding:11px 13px;font-size:14.5px}
.note.warn{background:var(--warn-soft)}.note.bad{background:var(--bad-soft)}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.mrow{display:grid;grid-template-columns:130px 1fr 150px 90px;gap:8px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow>b{font-weight:600;font-size:14px}
@media (max-width:640px){.mrow{grid-template-columns:1fr 1fr}.mrow>b,.mrow .mf{grid-column:1/-1}}
.med{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface2)}
.medh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.medh b{font:600 17px var(--f-display)}
.medgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:13.5px;font-weight:600}
.x{border:0;background:none;color:var(--muted);font:500 13px var(--f-body);text-decoration:underline;cursor:pointer;padding:4px}
.prog{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font:500 15px var(--f-body);text-align:start;width:100%;color:var(--ink)}
.prow span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13.5px}
.prow.ok span:last-child{color:var(--good)}
.advice{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.code{font:400 12px/1.4 ui-monospace,monospace;direction:ltr;text-align:left;min-height:140px}
.msg{font-size:13.5px;color:var(--muted)}
.foot{margin-top:24px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
/* clinician */
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv{background:var(--surface2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv span{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.kv b{font:600 19px var(--f-body);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv small{font-size:12px;color:var(--muted)}
[data-sev=high]{color:var(--bad)}[data-sev=mod]{color:var(--warn)}[data-sev=ok]{color:var(--good)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.chips{display:flex;flex-direction:column;gap:6px}
.chip{display:flex;gap:10px;align-items:baseline;font-size:14px;padding:7px 10px;border-radius:6px;background:var(--surface2)}
.chip::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip[data-sev=high]{background:var(--bad-soft);color:var(--ink)}.chip[data-sev=high]::before{background:var(--bad)}
.chip[data-sev=mod]{background:var(--warn-soft);color:var(--ink)}.chip[data-sev=mod]::before{background:var(--warn)}
.chip[data-sev=ok]{color:var(--ink)}.chip[data-sev=ok]::before{background:var(--good)}
.tier{padding:12px 14px;border-radius:8px;font-weight:600}
.tier[data-sev=high]{background:var(--bad-soft);color:var(--ink)}.tier[data-sev=mod]{background:var(--warn-soft);color:var(--ink)}.tier[data-sev=ok]{background:var(--good-soft);color:var(--ink)}
.medrow{border-top:1px solid var(--line);padding-block:10px}.medrow:first-child{border-top:0}
.medrow b{font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
[hidden]{display:none!important}

.actions{display:flex;flex-direction:column;gap:10px}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.big{font-size:16px;padding:14px;width:100%}
details.manual{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
details.manual>summary{cursor:pointer;font-weight:600;color:var(--accent)}
@media print{
 html,body{background:#fff!important}body{color:#000!important}
 .steps,.pager,.actions,#urgent,#btnLang,details.manual,.alert{display:none!important}
 .hero{background:#fff!important;box-shadow:none;border:1px solid #999}.hero,.hero *{color:#000!important}.hero::before{display:none}
 .panel[hidden]{display:flex!important}
 .shell{max-width:none;padding-inline:0}
 .grp,.med{background:#fff!important;color:#000!important;break-inside:avoid;box-shadow:none}
 input,textarea,select{background:#fff!important;color:#000!important;border-color:#999!important}
 .opt{background:#fff!important;color:#000!important}.opt:has(input:checked){background:#ddd!important;font-weight:700}
 .note,.credit,.hint,.intro,.sub{color:#000!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

<script>

/* ---------- option sets ---------- */

 f4:[['n',['لا','No']],['s',['أحياناً','Sometimes']],['y',['نعم، كثيراً','Yes, often']],['u',['لا أعرف','Not sure']]],

 hot:[['y',['نعم','Yes']],['s',['أحياناً','Sometimes']],['n',['لا','No']]]
};

/* ---------- sections ---------- */
const SECS=[
{id:'about',s:['البيانات','About'],t:['بيانات أساسية','Basic details'],intro:['نحتاج هذه البيانات لنعرف من يملأ الاستمارة وكيف نتواصل معكم.','So we know who is filling the form and how to reach you.'],items:[
 {k:'pt_name',type:'text',t:['اسم المريضة','Patient name']},
 {k:'pt_age',type:'num',t:['العمر','Age'],u:['سنة','years'],step:1},
 {k:'pt_sex',type:'seg',o:[['f',['أنثى','Female']],['m',['ذكر','Male']]],t:['النوع','Sex']},
 {k:'fill_name',type:'text',t:['اسمك (من يملأ الاستمارة)','Your name (person filling the form)']},
 {k:'fill_rel',type:'seg',o:[['mom',['الأم','Mother']],['dad',['الأب','Father']],['sib',['أخ أو أخت','Sibling']],['carer',['مرافق/ة','Paid carer']],['oth',['آخر','Other']]],t:['صلتك بالمريضة','Your relation to her']},
 {k:'fill_phone',type:'text',t:['رقم هاتف للتواصل','Phone number for follow-up']},
 {k:'fill_date',type:'date',t:['تاريخ التعبئة','Date']},
 {k:'fill_hrs',type:'num',t:['كم ساعة في اليوم تقضونها معها؟','Hours a day you are with her'],u:['ساعة','hours']},
 {type:'note',t:['تم تعبئة بعض البيانات من التقرير الطبي (العمر، التشخيص، الأدوية). يُرجى تصحيح أي بيان غير دقيق.','Some details are filled in from the medical report (age, diagnosis, medicines). Please correct anything that is not right.']}
]},
{id:'swallow',s:['البلع','Swallowing'],t:['أمان البلع','Swallowing safety'],intro:['هذه أهم الأسئلة. تساعد الطبيب على معرفة هل الأكل عن طريق الفم آمن.','These are the most important questions. They tell the clinician whether eating by mouth is safe.'],items:[
 {type:'chk',tone:'bad',t:['هل حدث أي مما يلي؟ (علامات خطر)','Has any of this happened? (warning signs)'],h:['إذا اخترتم أي بند: أوقفوا الإطعام الروتيني عن طريق الفم واطلبوا تقييماً طبياً عاجلاً.','If you tick any item: stop routine feeding by mouth and get urgent medical assessment.'],c:[

 {k:'sw_chest',type:'seg',o:'f4',t:['هل أُصيبت بالتهابات صدرية متكررة أو حرارة أو مشاكل تنفس غير مفسرة؟','Has she had repeated chest infections, fever or unexplained breathing problems?']},
 {k:'sw_chestn',type:'num',if:'sw_chest=s|y',t:['كم التهاباً صدرياً في آخر سنة؟','How many chest infections in the last year?'],step:1},
 {k:'sw_study',type:'seg',o:[['none',['لا','No']],['bed',['فحص بلع عند أخصائي','Bedside swallow check']],['vfss',['أشعة بلع بالصبغة (VFSS)','X-ray swallow study (VFSS)']],['fees',['منظار بلع (FEES)','Endoscopic swallow study (FEES)']],['u',['لا أعرف','Not sure']]],t:['هل أُجري لها تقييم للبلع من قبل؟','Has she ever had a swallowing assessment?']},
 {k:'sw_studyd',type:'area',if:'sw_study=bed|vfss|fees',t:['التاريخ والنتيجة إن عُرفت','Date and result, if known']},
 {k:'sw_rx',type:'seg',o:'ynu',t:['هل وصف طبيب قواماً معيناً للطعام أو سُمك السوائل؟','Has a clinician prescribed a food texture or liquid thickness?']},
 {k:'sw_rxt',type:'area',if:'sw_rx=y',t:['ما الذي وُصف؟','What was prescribed?']},
 {type:'note',tone:'warn',t:['لا تغيّروا قوام الطعام، ولا تضيفوا مثخّناً أو نشا للسوائل من تلقاء أنفسكم دون استشارة مختص.','Please do not change food textures or thicken liquids on your own without professional advice.']}

  if(it.type==='note')return `<div class="note ${it.tone||''}"${cond}>${L(it.t)}</div>`;
  if(it.type==='meals')return mealsHTML();
  if(it.type==='meds')return medsHTML();
  if(it.type==='chk')return `<div class="q"${cond}><div class="ql">${L(it.t)}</div>${it.h?`<p class="hint">${L(it.h)}</p>`:''}<div class="${it.tone==='bad'?'note bad':''}"><div class="cks">${it.c.map(c=>`<label class="ck"><input type="checkbox" data-k="${c[0]}" id="f_${c[0]}"><span>${L(c[1])}</span></label>`).join('')}</div></div></div>`;
  const lab=`<div class="ql" id="l_${it.k}">${L(it.t)}</div>`;
  let body='';
  if(it.type==='seg')body=`<div class="seg" role="radiogroup" aria-labelledby="l_${it.k}">${optsOf(it).map(a=>`<label class="opt"><input type="radio" name="r_${it.k}" data-k="${it.k}" value="${a[0]}"><span>${L(a[1])}</span></label>`).join('')}</div>`;
  else if(it.type==='num')body=`<div class="inp"><input type="number" inputmode="decimal" min="0" step="${it.step||'any'}" data-k="${it.k}" id="f_${it.k}" aria-labelledby="l_${it.k}">${it.u?`<i>${L(it.u)}</i>`:''}</div>`;
  else if(it.type==='text')body=`<input type="${'text'}" data-k="${it.k}" id="f_${it.k}" aria-labelledby="l_${it.k}">`;
  else if(it.type==='date')body=`<div class="inp"><input type="date" data-k="${it.k}" id="f_${it.k}" aria-labelledby="l_${it.k}"></div>`;
  else body=`<textarea rows="3" data-k="${it.k}" id="f_${it.k}" aria-labelledby="l_${it.k}"></textarea>`;
  return `<div class="q"${cond}>${lab}${body}</div>`;
}

  save();updCare();

function secStat(s){const ks=KEYS.filter(k=>ITEM[k].sec===s.id);const a=ks.filter(k=>S[k]!==undefined&&S[k]!=='').length;return{a,t:ks.length};}
function medsDone(){return S.meds.some(m=>m.name&&(m.dose||m.times));}
const MAIL='randareda@gmail.com';
const WA_NUMBER=''; /* To send straight to one WhatsApp number, set this to the number with country code, for example '2010XXXXXXXX'. Empty lets the sender pick the contact. */
function answersObj(){const o={};Object.keys(S).forEach(k=>{if(k[0]!=='_'&&k.slice(0,3)!=='cl_')o[k]=S[k];});return o;}
const b64=bytes=>{let t='';for(let i=0;i<bytes.length;i+=8192)t+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(t);};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function pipe(bytes,stream){const w=stream.writable.getWriter();w.write(bytes);w.close();return new Uint8Array(await new Response(stream.readable).arrayBuffer());}
let CODE='',codeTimer=null,codeSeq=0;
function codeSync(){return 'RDA1:'+b64(new TextEncoder().encode(JSON.stringify(answersObj())))+':END';}
function refreshCode(){
  CODE=codeSync();
  if(typeof CompressionStream==='undefined'||typeof Response==='undefined')return;
  clearTimeout(codeTimer);const seq=++codeSeq;
  codeTimer=setTimeout(async()=>{try{
    const z=await pipe(new TextEncoder().encode(JSON.stringify(answersObj())),new CompressionStream('deflate-raw'));
    const c='RDA2:'+b64(z).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')+':END';
    if(seq===codeSeq&&c.length<CODE.length){CODE=c;const cb=$('#codeBox');if(cb)cb.value=buildMessage();}
  }catch(e){}},300);
}
function visible(it){if(!it.if)return true;const q=it.if.split('=');return q[1].split('|').includes(String(S[q[0]]||''));}
function readable(){
  const o=['استمارة تغذية وبلع / Feeding and swallowing questionnaire',
   'Patient: '+(S.pt_name||'-')+(S.pt_age?', '+S.pt_age+' y':'')+' | Date: '+(S.fill_date||'-'),
   'Filled by: '+(S.fill_name||'-')+(S.fill_rel?' ('+optEn('fill_rel',S.fill_rel)+')':'')+(S.fill_phone?' | '+S.fill_phone:'')];
  const rf=RF.filter(k=>S[k]).map(k=>RFL[k]);
  if(rf.length)o.push('','WARNING SIGNS REPORTED: '+rf.join(', '));
  SECS.forEach(sec=>{
    if(sec.custom||sec.id==='about')return;const lines=[];
    sec.items.forEach(it=>{
      if(it.type==='note'||!visible(it))return;
      if(it.type==='chk'){const on=it.c.filter(c=>S[c[0]]).map(c=>EN(c[1]));if(on.length)lines.push('• '+EN(it.t)+': '+on.join(', '));return;}
      if(it.type==='meals'){SLOTS.forEach(sl=>{const v=S.mr[sl[0]];if(v&&(v.food||v.eat||v.min))lines.push('• '+EN(sl[1])+': '+(v.food||'-')+(v.eat?' ('+EN(EATEN.find(e=>e[0]===v.eat)[1]).toLowerCase()+')':'')+(v.min?', '+v.min+' min':''));});if(S.mr_typ)lines.push('• Typical day: '+(S.mr_typ==='y'?'Yes':'No'));return;}
      if(it.type==='meds'){S.meds.filter(m=>m.name).forEach(m=>{const fxs=FX.filter(f=>m.fx&&m.fx[f[0]]).map(f=>EN(f[1]).toLowerCase());
        const dt=[m.dose,m.times,m.meal?EN(MEALR.find(x=>x[0]===m.meal)[1]).toLowerCase():'',m.swallow?'swallowing: '+EN(SWAL.find(x=>x[0]===m.swallow)[1]).toLowerCase():'',m.crush?EN(CRUSH.find(x=>x[0]===m.crush)[1]).toLowerCase():'',fxs.length?'noticed: '+fxs.join(', '):''].filter(Boolean).join(' | ');lines.push('• '+m.name+(dt?': '+dt:''));});return;}
      const v=S[it.k];if(v===undefined||v==='')return;
      lines.push('• '+EN(it.t)+': '+(it.type==='seg'?optEn(it.k,v):v+(it.u?' '+EN(it.u):'')));
    });
    if(lines.length)o.push('',EN(sec.t).toUpperCase(),lines.join('\n'));
  });
  return o.join('\n');
}
function buildMessage(){return readable()+'\n\n— — —\nلا تعدلوا السطر التالي / Do not edit the line below\n'+(CODE||codeSync());}
function shortHeader(){return 'استمارة تغذية وبلع / Feeding questionnaire\nPatient: '+(S.pt_name||'-')+' | Date: '+(S.fill_date||'-')+' | Filled by: '+(S.fill_name||'-');}

function updCare(){
  $$('[data-if]').forEach(e=>{const p=e.dataset.if.split('=');e.hidden=!p[1].split('|').includes(String(S[p[0]]||''));});
  $('#urgent').hidden=!RF.some(k=>S[k]);
  SECS.forEach(s=>{const b=$('#st_'+s.id);if(!b||s.custom)return;const st=secStat(s);b.classList.toggle('done',st.t>0&&st.a===st.t||(s.id==='meds'&&medsDone())||(!st.t&&s.id!=='meds'&&false));});
  const pr=$('#prog');
  if(pr){pr.innerHTML=SECS.filter(s=>!s.custom).map((s,i)=>{const st=secStat(s);const txt=s.id==='meds'?(medsDone()?L(['تم','Done']):L(['لم يكتمل','Not done'])):st.t?st.a+' / '+st.t:'';const ok=s.id==='meds'?medsDone():st.t>0&&st.a===st.t;return `<button type="button" class="prow${ok?' ok':''}" data-go="${SECS.indexOf(s)}"><span>${i+1}. ${L(s.t)}</span><span>${txt}</span></button>`;}).join('');}
  refreshCode();const cb=$('#codeBox');if(cb)cb.value=buildMessage();
}

/* ---------- clinician analysis ---------- */
const sv=v=>v==='n'?0:v==='s'?1:v==='y'?2:null;
const SW=[['sw_cough','coughing or choking with eating or drinking'],['sw_thin','more coughing with thin liquids'],['sw_wet','wet or gurgly voice after swallowing'],['sw_pocket','food pocketing in the mouth'],['sw_drool','drooling or poor saliva control'],['sw_multi','multiple swallows per bite'],['sw_nasal','nasal regurgitation'],['sw_chest','repeated chest infections or breathing problems']];
const RFL={rf1:'repeated choking or coughing',rf2:'difficulty breathing around meals',rf3:'cannot swallow saliva',rf4:'blue lips',rf5:'suspected aspiration'};

function derive(){

  else if(d.swScore>=6||(d.swKey.length>=2&&d.swScore>=3))d.tier={sev:'high',lv:2,tx:'High reported risk (score '+d.swScore+' of 16). Instrumental swallowing assessment before finalizing texture and fluids.'};
  else if(d.swScore>=2||d.swKey.length)d.tier={sev:'mod',lv:1,tx:'Moderate reported risk (score '+d.swScore+' of 16). Speech-language swallowing assessment advised.'};
  else if(d.swAns>=6)d.tier={sev:'ok',lv:0,tx:'Low reported risk (score '+d.swScore+' of 16). Confirm with a mealtime observation.'};
  else d.tier={sev:'',lv:-1,tx:'Swallowing screen incomplete ('+d.swAns+' of 8 answered).'};

  d.dep=S.ch_assist==='full'?'Fully dependent for feeding':S.ch_assist==='part'?'Needs partial feeding help':S.ch_assist==='setup'?'Needs setup only':S.ch_assist==='none'?'Independent':null;

function must(d){

const chip=(sev,t)=>`<div class="chip" data-sev="${sev}">${esc(t)}</div>`;
const kv=(l,v,s,h)=>`<div class="kv"><span>${l}</span><b${s?` data-sev="${s}"`:''}>${v}</b>${h?`<small>${h}</small>`:''}</div>`;
function flagsList(d){

  if(S.sw_study==='none'&&d.tier.lv>=1)add('mod','No swallowing assessment on record');
  if(d.c3!=null&&d.c3<=-5)add('high','Weight down '+fx(-d.c3)+'% in 3 months');
  if(d.c6!=null&&d.c6<=-10)add('high','Weight down '+fx(-d.c6)+'% in 6 months');else if(d.c6!=null&&d.c6<=-5)add('mod','Weight down '+fx(-d.c6)+'% in 6 months');

  if(d.maxMin>=45||S.sw_long==='y')add('mod','Meals take 45 minutes or longer');
  if(d.fPct!=null&&d.fPct<70)add('high','Reported fluid intake is '+n0(d.fPct)+'% of 30 mL/kg');else if(d.fPct!=null&&d.fPct<90)add('mod','Reported fluid intake is '+n0(d.fPct)+'% of 30 mL/kg');
  if(S.hy_urine==='c'||S.hy_dark==='y')add('mod','Signs of low hydration (infrequent or dark urine)');
  if(S.hy_rest==='y')add('mod','Medical fluid restriction reported'+(S.hy_restt?': '+S.hy_restt:''));
  if(d.sedat.length)add('mod','Possible medicine effects on feeding: '+d.sedat.map(m=>m.name).join(', '));
  if(d.meds.some(m=>m.crush&&m.crush!=='n'))add('mod','Medicine crushed or mixed with food or drink: pharmacist check needed');

  if(S.en_know!=='y'||S.en_aid!=='y')add(S.en_know===undefined&&S.en_aid===undefined?'':'mod','Caregiver may need training in choking recognition and response');

}
function clarify(d){
  const out=[];

const PLANL=[

 ['cl_p2','Interim: keep current prescribed textures and fluids unchanged until assessed',d=>d.tier.lv>=0],

 ['cl_p4','Caregiver training: recognizing and responding to choking and aspiration',d=>S.en_know!=='y'||S.en_aid!=='y'||S.en_train==='y'],
 ['cl_p5','Medicine review with the neurologist and pharmacist: timing, formulation, sedation, swallowing effects',d=>d.sedat.length>0||d.meds.some(m=>m.crush&&m.crush!=='n'||m.swallow==='d'||m.swallow==='n')],
 ['cl_p6','Energy and protein fortification plan; small frequent meals; oral nutrition supplement if needed',d=>(d.c3!=null&&d.c3<0)||(d.bmi!=null&&d.bmi<20)||S.nu_eaten==='q1'||S.nu_eaten==='q2'],

function pesDraft(d){
  const out=[];const g=glim(d);

  const intake=[];if(S.nu_eaten==='q1'||S.nu_eaten==='q2')intake.push('usually eats under half of each meal');if(S.nu_dec==='m'||S.nu_dec==='s')intake.push('intake reduced over 3 months');if(d.maxMin>=45)intake.push('meals taking '+n0(d.maxMin)+' minutes');
  if(intake.length)out.push('Inadequate oral intake related to dysphagia, fatigue and difficulty self-feeding as evidenced by '+intake.join(', ')+'.');
  const wl=[];if(d.c3!=null&&d.c3<=-5)wl.push(fx(-d.c3)+'% loss in 3 months');if(d.c6!=null&&d.c6<=-5)wl.push(fx(-d.c6)+'% loss in 6 months');if(d.bmi!=null&&d.bmi<20)wl.push('BMI '+fx(d.bmi));
  if(wl.length)out.push('Unintended weight loss related to increased energy expenditure from involuntary movements and inadequate intake as evidenced by '+wl.join(', ')+'.');
  if(d.assist&&d.assist!=='none'||d.fn>0)out.push('Self-feeding difficulty related to chorea as evidenced by '+(d.dep?d.dep.toLowerCase():'difficulty holding utensils or bringing food to the mouth')+'.');

  nu+='</div>';$('#a_nu').innerHTML=nu;
  let nd='<div class="kvs">'+kv('Resting energy',d.bee?n0(d.bee)+' kcal':'—',null,'Mifflin-St Jeor')+kv('Energy estimate',d.tee?n0(d.tee)+' kcal':'—',null,'adjust by weight response; chorea raises needs')+kv('Protein target',d.prot?n0(d.prot)+' g':'—')+kv('Fluid target',d.fLo?n0(d.fLo)+' to '+n0(d.fHi)+' mL':'—',null,'30 to 35 mL/kg')+kv('Reported fluid',d.fluid!=null?n0(d.fluid)+' mL':'—',d.fPct!=null&&d.fPct<70?'high':d.fPct!=null&&d.fPct<90?'mod':null,d.fPct!=null?n0(d.fPct)+'% of 30 mL/kg':'cups and cup size')+'</div>';
  const hy=[];if(S.hy_urine)hy.push('Urine: '+optEn('hy_urine',S.hy_urine));if(S.hy_dark)hy.push('Dark urine: '+optEn('hy_dark',S.hy_dark));['hy_s1','hy_s2','hy_s3','hy_s4'].forEach(k=>{if(S[k])hy.push(EN(ITEM[k].t));});if(S.hy_thick)hy.push('Liquids: '+S.hy_thick);
  if(hy.length)nd+='<div class="chips" style="margin-top:10px">'+hy.map(t=>chip('',t)).join('')+'</div>';
  $('#a_need').innerHTML=nd;
  let md='';
  d.meds.forEach(m=>{const fxs=FX.filter(f=>m.fx&&m.fx[f[0]]).map(f=>EN(f[1]));
    md+=`<div class="medrow"><b>${esc(m.name)}</b>${m.form?' · '+EN(FORMS.find(f=>f[0]===m.form)[1]):''}<div class="hint">Dose ${esc(m.dose||'not given')} · ${esc(m.times||'schedule not given')} · ${m.meal?EN(MEALR.find(x=>x[0]===m.meal)[1]).toLowerCase():'meal timing not given'}</div>
    <div class="hint">Swallowing it: ${m.swallow?EN(SWAL.find(x=>x[0]===m.swallow)[1]).toLowerCase():'not answered'} · ${m.crush?EN(CRUSH.find(x=>x[0]===m.crush)[1]).toLowerCase():'crushing not answered'}</div>
    ${fxs.length?`<div class="chip" data-sev="mod" style="margin-top:6px">Reported after dose: ${esc(fxs.join(', '))}</div>`:''}</div>`;});
  if(!d.meds.length)md='<p class="muted">No medicines listed.</p>';
  md+=`<p class="hint" style="margin-top:8px">${d.meds.length} medicine${d.meds.length===1?'':'s'} listed. Verify names and doses against the boxes or prescription, and confirm formulation with a pharmacist before any crushing.</p>`;
  $('#a_med').innerHTML=md;
  const cl=clarify(d);$('#a_clar').innerHTML=cl.length?cl.map(t=>chip('mod',t)).join(''):'<p class="muted">Nothing outstanding.</p>';
  $('#a_plan').innerHTML=PLANL.map(p=>`<label class="ck"><input type="checkbox" data-k="${p[0]}" id="f_${p[0]}"><span>${p[1]}${p[2](d)?' <em style="font-style:normal;font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 6px">suggested</em>':''}</span></label>`).join('');
  $$('#a_plan [data-k]').forEach(e=>{e.checked=!!S[e.dataset.k];});
  $('#reportText').value=report(d,mu,g,F);
}
function report(d,mu,g,F){
  const L2=[];const add=(k,v)=>{if(v!==''&&v!=null&&v!=='—')L2.push(k+': '+v);};
  L2.push('FEEDING AND SWALLOWING ASSESSMENT, HUNTINGTON\'S DISEASE');L2.push('Created by Professor Randa Reda Mabrouk for the nutritional assessment of the patient.');
  add('Patient',[S.pt_name,S.pt_age?S.pt_age+' y':'',S.pt_sex==='f'?'female':S.pt_sex==='m'?'male':''].filter(Boolean).join(', '));
  add('Questionnaire filled by',(S.fill_name||'')+(S.fill_rel?' ('+optEn('fill_rel',S.fill_rel)+')':'')+(S.fill_date?', '+S.fill_date:''));
  add('Diagnosis',S.md_dx);add('Neurological status',S.md_neuro);
  add('Allergies',S.md_allergy==='none'?'none known':S.md_allergy==='y'?S.md_allt||'yes':'');add('DBS',S.md_dbs==='y'?'in place'+(S.md_dbsc?'; '+S.md_dbsc:''):'');
  L2.push('');L2.push('SWALLOWING (caregiver report)');L2.push(d.tier.tx);
  d.swPos.forEach(a=>L2.push('- '+a[1]+': '+optEn(a[0],S[a[0]])));
  add('Swallowing study',S.sw_study?optEn('sw_study',S.sw_study):'');add('Prescribed texture or thickness',S.sw_rx==='y'?S.sw_rxt||'yes':S.sw_rx?optEn('sw_rx',S.sw_rx):'');
  L2.push('');L2.push('FUNCTION');add('Feeding help',d.dep);add('Chorea',S.ch_sev?optEn('ch_sev',S.ch_sev):'');add('Alertness at meals',S.ch_alert?optEn('ch_alert',S.ch_alert):'');
  L2.push('');L2.push('NUTRITION');
  add('Weight',d.wt?fx(d.wt)+' kg':'');add('Height',S.nu_ht?S.nu_ht+' cm':'');add('BMI',d.bmi!=null?fx(d.bmi):'');
  add('Weight change 1 / 3 / 6 months',[d.c1,d.c3,d.c6].some(x=>x!=null)?[d.c1,d.c3,d.c6].map(pct).join(' / '):'');
  add('MUST',mu?mu.t+', '+mu.tx:'');add('Usually eats',S.nu_eaten?optEn('nu_eaten',S.nu_eaten):'');add('Appetite',S.nu_app?optEn('nu_app',S.nu_app):'');
  add('Estimated energy',d.tee?n0(d.tee)+' kcal':'');add('Protein target',d.prot?n0(d.prot)+' g':'');
  add('Fluid target',d.fLo?n0(d.fLo)+' to '+n0(d.fHi)+' mL':'');add('Reported fluid',d.fluid!=null?n0(d.fluid)+' mL':'');
  L2.push('');L2.push('MEDICINES');d.meds.forEach(m=>L2.push('- '+m.name+(m.dose?', '+m.dose:'')+(m.times?', '+m.times:'')+(m.fx&&Object.keys(m.fx).some(k=>m.fx[k])?' (reported: '+FX.filter(f=>m.fx[f[0]]).map(f=>EN(f[1]).toLowerCase()).join(', ')+')':'')));
  L2.push('');L2.push('FINDINGS');if(F.length)F.forEach(f=>L2.push('- '+f[1]));else L2.push('- None flagged');
  add('Clinician mealtime observation',S.cl_obs);
  if(S.cl_pes){L2.push('');L2.push('NUTRITION DIAGNOSIS');L2.push(S.cl_pes);}
  const pl=PLANL.filter(p=>S[p[0]]);if(pl.length){L2.push('');L2.push('PLAN');pl.forEach(p=>L2.push('- '+p[1]));}
  add('Review in',S.cl_review);add('Plan notes',S.cl_notes);
  L2.push('');L2.push('Free-text answers from the caregiver');
  ['tl_safe','tl_hard','tl_refuse','pf_cult','pf_fav','pf_dis','pf_sched','pf_goal','pf_worry','md_oth','en_ppl','nu_lossn'].forEach(k=>{if(S[k]&&S[k].trim)add(EN(ITEM[k].t),S[k].trim());});
  SLOTS.forEach(s=>{const v=S.mr[s[0]];if(v&&v.food)add('Typical day, '+EN(s[1]).toLowerCase(),v.food+(v.eat?' ('+EN(EATEN.find(e=>e[0]===v.eat)[1]).toLowerCase()+')':'')+(v.min?', '+v.min+' min':''));});
  L2.push('');L2.push('Serum albumin is not used as a nutritional marker.');
  return L2.join('\n');
}

/* ---------- events ---------- */
function handler(e){
  const el=e.target;if(!el||!el.dataset)return;
  if(el.dataset.mr){const r=S.mr[el.dataset.mr]=S.mr[el.dataset.mr]||{};r[el.dataset.f]=el.value;save();return upd();}
  if(el.dataset.med!==undefined&&el.dataset.med!==''){const m=S.meds[Number(el.dataset.med)];if(!m)return;
    if(el.dataset.fx){m.fx=m.fx||{};m.fx[el.dataset.fx]=el.checked;}else m[el.dataset.f]=el.value;save();return upd();}
  const k=el.dataset.k;if(!k)return;
  if(el.type==='checkbox')S[k]=el.checked;else if(el.type==='radio'){if(el.checked)S[k]=el.value;}else S[k]=el.value;
  save();upd();
}
function upd(){if(MODE==='care')updCare();else fillClin();}
function applyState(){
  $$('[data-k]').forEach(el=>{const v=S[el.dataset.k];
    if(el.type==='checkbox')el.checked=!!v;else if(el.type==='radio')el.checked=(v!==undefined&&String(v)===el.value);else el.value=(v==null?'':v);});
}
document.addEventListener('input',handler);document.addEventListener('change',handler);
async function copyText(txt,msgEl,box,okTxt,failTxt){
  const fb=()=>{box.focus();box.select();msgEl.textContent=failTxt;};
  try{await navigator.clipboard.writeText(txt);msgEl.textContent=okTxt;}catch(err){fb();}
}
document.addEventListener('click',e=>{
  const t=e.target.closest?e.target.closest('button'):null;if(!t)return;
  if(t.dataset.step!==undefined)return showStep(Number(t.dataset.step));
  if(t.dataset.go!==undefined){showStep(Number(t.dataset.go));window.scrollTo&&window.scrollTo(0,0);return;}
  if(t.id==='btnLang'){S._lang=lang()==='ar'?'en':'ar';save();render();return;}
  if(t.id==='addMed'){S.meds.push({name:'',fx:{}});save();buildMedsPanel();return;}
  if(t.dataset.delmed!==undefined){S.meds.splice(Number(t.dataset.delmed),1);save();buildMedsPanel();return;}
  if(t.id==='btnWa')return sendWhatsApp();
  if(t.id==='btnMail')return sendEmail();
  if(t.id==='btnPrint'){window.print();return;}
  if(t.id==='btnCopy'){
    if(MODE==='care'){const box=$('#codeBox');return copyText(box.value,$('#copyMsg'),box,L(['تم النسخ. الصقوه في رسالة واتساب.','Copied. Paste it into a WhatsApp message.']),L(['حدّدوا النص وانسخوه يدوياً.','Select the text and copy it by hand.']));}
    const box=$('#reportText');return copyText(box.value,$('#copyMsg'),box,'Copied.','Select the text and copy it by hand.');
  }
  if(t.id==='btnImp'){importCode($('#impBox').value).then(r=>{$('#impMsg').textContent=r.msg;if(r.ok){applyState();fillClin();}});return;}
  if(t.id==='btnClr'){const keep={cl_factor:S.cl_factor,cl_prot:S.cl_prot};S=base();S._lang='en';save();render();return;}
  if(t.id==='btnPes'){S.cl_pes=pesDraft(D);save();fillClin();$('#f_cl_pes').value=S.cl_pes;return;}
});
function buildMedsPanel(){
  const p=$('#p_meds');const box=p.querySelectorAll('.grp')[1];box.innerHTML=medsHTML();updCare();
}
async function importCode(txt){
  const m=txt.match(/RDA([12]):/);if(!m)return{ok:false,msg:'No answer code found. Paste the whole message.'};
  const rest=txt.slice(m.index+5).replace(/\s+/g,'');
  try{let bytes;
    if(m[1]==='2'){let t=(rest.match(/^[A-Za-z0-9_\-]+/)||[''])[0].replace(/-/g,'+').replace(/_/g,'/');t+='='.repeat((4-t.length%4)%4);bytes=await pipe(unb64(t),new DecompressionStream('deflate-raw'));}
    else bytes=unb64((rest.match(/^[A-Za-z0-9+\/=]+/)||[''])[0]);
    const o=JSON.parse(new TextDecoder().decode(bytes));
    if(!o||typeof o!=='object')throw new Error('bad');
    const keep={cl_factor:S.cl_factor,cl_prot:S.cl_prot};
    S=Object.assign(base(),o,keep);S._lang='en';if(!Array.isArray(S.meds))S.meds=[];if(!S.mr)S.mr={};save();
    return{ok:true,msg:'Answers loaded.'};
  }catch(err){return{ok:false,msg:'The code could not be read. Ask the caregiver to copy the message again without editing it.'};}
}
function render(){
  MODE=(location.hash==='#clinician')?'clin':'care';
  if(MODE==='clin'){buildClin();applyState();fillClin();}
  else{buildCare();applyState();showStep(S._step||0);}
}
window.addEventListener('hashchange',render);
load();render();
})();
</script>
